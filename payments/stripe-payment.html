<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demarest Nature Center - Membership</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #5a8c2e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 36px;
            color: #2d5016;
            font-weight: bold;
            margin-bottom: 5px;
        }
        h1 { 
            color: #2d5016; 
            margin-bottom: 10px; 
            font-size: 28px; 
        }
        .subtitle { 
            color: #666; 
            margin-bottom: 30px; 
            font-size: 14px; 
        }
        .form-row { margin-bottom: 20px; }
        .form-row-half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"], 
        input[type="email"], 
        input[type="tel"],
        select, 
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #5a8c2e;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        #card-element {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }
        #card-errors { 
            color: #e74c3c; 
            margin-top: 8px; 
            font-size: 13px; 
        }
        .membership-info {
            background: #f0f7eb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #5a8c2e;
        }
        .membership-info h3 {
            color: #2d5016;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .membership-info p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
        .price-info {
            background: #2d5016;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }
        .price-amount { 
            font-size: 48px; 
            font-weight: bold; 
            margin-bottom: 5px;
        }
        .price-period {
            font-size: 16px;
            opacity: 0.9;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }
        button {
            background: linear-gradient(135deg, #2d5016 0%, #5a8c2e 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            border: 0;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-message, .error-message {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .success-message { 
            background: #d4edda; 
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error-message { 
            background: #f8d7da; 
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .section-title {
            color: #2d5016;
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f7eb;
        }
        @media (max-width: 600px) {
            .form-row-half {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌲 Demarest Nature Center</div>
            <h1>Membership Registration</h1>
            <p class="subtitle">Join us in preserving and protecting our natural heritage</p>
        </div>
        
        <div class="success-message" id="success-message">
            ✓ Payment successful! Thank you for becoming a member of Demarest Nature Center.
        </div>
        <div class="error-message" id="error-message"></div>
        
        <form id="payment-form">
            <!-- Membership Selection -->
            <div class="form-row">
                <label for="membership-type">Select Membership Level *</label>
                <select id="membership-type" required>
                    <option value="">Choose your membership</option>
                    <option value="individual" data-price="25" data-period="year">Individual (Trail Walker) - $25/year</option>
                    <option value="family" data-price="50" data-period="year">Family (Trail Hikers) - $50/year</option>
                    <option value="ranger" data-price="100" data-period="year">Trail Ranger - $100/year</option>
                    <option value="steward" data-price="200" data-period="year">Trail Steward - $200/year</option>
                    <option value="benefactor" data-price="500" data-period="year">Trail Benefactor - $500/year</option>
                    <option value="lifetime" data-price="1000" data-period="one-time">Lifetime Member - $1,000 one-time</option>
                </select>
            </div>
            
            <div class="membership-info" id="membership-info" style="display: none;">
                <h3 id="membership-title"></h3>
                <p id="membership-description"></p>
            </div>
            
            <div class="price-info" id="price-info" style="display: none;">
                <div class="price-amount" id="price-amount">$0</div>
                <div class="price-period">Annual Membership</div>
            </div>
            
            <!-- Personal Information -->
            <div class="section-title">Personal Information</div>
            
            <div class="form-row">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-row">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>
            
            <div class="form-row">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="(201) 555-0100">
            </div>
            
            <!-- Address Information -->
            <div class="section-title">Home Address</div>
            
            <div class="form-row">
                <label for="address">Street Address *</label>
                <input type="text" id="address" placeholder="123 Main Street" required>
            </div>
            
            <div class="form-row">
                <label for="address2">Apartment, Suite, etc. (Optional)</label>
                <input type="text" id="address2" placeholder="Apt 4B">
            </div>
            
            <div class="form-row-half">
                <div>
                    <label for="city">City *</label>
                    <input type="text" id="city" placeholder="Demarest" required>
                </div>
                <div>
                    <label for="state">State *</label>
                    <input type="text" id="state" placeholder="NJ" required>
                </div>
            </div>
            
            <div class="form-row-half">
                <div>
                    <label for="zip">ZIP Code *</label>
                    <input type="text" id="zip" placeholder="07627" required>
                </div>
                <div>
                    <label for="country">Country</label>
                    <input type="text" id="country" value="United States">
                </div>
            </div>
            
            <!-- Auto-Renewal Option -->
            <div class="checkbox-group">
                <input type="checkbox" id="auto-renew" name="auto-renew">
                <label for="auto-renew">Automatically renew my membership annually</label>
            </div>
            
            <!-- Payment Information -->
            <div class="section-title">Payment Information</div>
            
            <div class="form-row">
                <label for="card-element">Card Information *</label>
                <div id="card-element"></div>
                <div id="card-errors" role="alert"></div>
            </div>
            
            <button type="submit" id="submit-button">
                <span id="button-text">Complete Membership Payment</span>
            </button>
        </form>
    </div>

    <script>
        // REPLACE THESE VALUES
        const STRIPE_PUBLISHABLE_KEY = 'pk_live_51LkeMcA1N6seFAaOqxBs8DHhoqGgzrJTo7bAQoEbr3ylLzVuda6RNWbR1eWz4JxVOTTGpU5etk0og1Rfv0fNiyWp00uwDpQuxY';
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTPazMNNqF6KJFoxcsmfr0LBf3x89fncfBqgYIPjyRG8t1n27--QHazuISSFX1rEyI/exec';

        // Membership descriptions based on Demarest Nature Center website
        const MEMBERSHIP_DETAILS = {
            individual: {
                title: 'Individual Member (Trail Walker)',
                description: 'Basic membership for one adult (18+). Includes newsletter, members-only events, program discounts, and merchandise discounts at participating local stores.'
            },
            family: {
                title: 'Family Membership (Trail Hikers)',
                description: 'Membership for one adult (18+) and family. Includes newsletter, members-only events, program discounts, and merchandise discounts at participating local stores.'
            },
            ranger: {
                title: 'Trail Ranger',
                description: 'Membership for two adults (18+) and children (18 & under) in the same household. Includes all standard member benefits.'
            },
            steward: {
                title: 'Trail Steward',
                description: 'Membership for two adults (18+) and children (18 & under) in the same household. Includes all standard member benefits with greater impact.'
            },
            benefactor: {
                title: 'Trail Benefactor',
                description: 'Top annual giving level. Membership for two adults (18+) and children (18 & under) in the same household, with all member benefits.'
            },
            lifetime: {
                title: 'Lifetime Member',
                description: 'A lasting commitment to conservation. Receive Trail Benefactor benefits in perpetuity and permanent recognition on our Wall of Honor.'
            }
        };

        const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
        const elements = stripe.elements();
        const cardElement = elements.create('card', {
            style: {
                base: {
                    fontSize: '16px',
                    color: '#32325d',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    '::placeholder': { color: '#aab7c4' }
                },
                invalid: { color: '#e74c3c' }
            }
        });
        cardElement.mount('#card-element');

        cardElement.addEventListener('change', ({error}) => {
            document.getElementById('card-errors').textContent = error ? error.message : '';
        });

        // Update membership info and price when selection changes
        document.getElementById('membership-type').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const value = selectedOption.value;
            
            if (value) {
                const price = selectedOption.getAttribute('data-price');
                const details = MEMBERSHIP_DETAILS[value];
                
                document.getElementById('price-amount').textContent = '$' + price;
                document.getElementById('price-info').style.display = 'block';
                
                document.getElementById('membership-title').textContent = details.title;
                document.getElementById('membership-description').textContent = details.description;
                document.getElementById('membership-info').style.display = 'block';
            } else {
                document.getElementById('price-info').style.display = 'none';
                document.getElementById('membership-info').style.display = 'none';
            }
        });

        // Form submission
        document.getElementById('payment-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const submitButton = document.getElementById('submit-button');
            const buttonText = document.getElementById('button-text');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            submitButton.disabled = true;
            buttonText.innerHTML = '<span class="spinner"></span>Processing payment...';

            // Collect form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                address2: document.getElementById('address2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip: document.getElementById('zip').value,
                country: document.getElementById('country').value,
                membershipType: document.getElementById('membership-type').value,
                autoRenew: document.getElementById('auto-renew').checked,
                amount: document.getElementById('membership-type').options[
                    document.getElementById('membership-type').selectedIndex
                ].getAttribute('data-price')
            };

            try {
                // Step 1: Create Payment Intent
                const intentResponse = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'createPaymentIntent',
                        ...formData
                    })
                });

                const intentData = await intentResponse.json();
                if (intentData.error) throw new Error(intentData.error);

                // Step 2: Confirm payment with Stripe
                const {error: stripeError, paymentIntent} = await stripe.confirmCardPayment(
                    intentData.clientSecret,
                    {
                        payment_method: {
                            card: cardElement,
                            billing_details: {
                                name: formData.name,
                                email: formData.email,
                                phone: formData.phone,
                                address: {
                                    line1: formData.address,
                                    line2: formData.address2,
                                    city: formData.city,
                                    state: formData.state,
                                    postal_code: formData.zip,
                                    country: 'US'
                                }
                            }
                        }
                    }
                );

                if (stripeError) throw new Error(stripeError.message);

                // Step 3: Record to Google Sheets
                if (paymentIntent && paymentIntent.status === 'succeeded') {
                    await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'recordPayment',
                            paymentIntentId: paymentIntent.id,
                            ...formData
                        })
                    });

                    successMessage.style.display = 'block';
                    document.getElementById('payment-form').reset();
                    cardElement.clear();
                    document.getElementById('price-info').style.display = 'none';
                    document.getElementById('membership-info').style.display = 'none';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } finally {
                submitButton.disabled = false;
                buttonText.textContent = 'Complete Membership Payment';
            }
        });
    </script>
</body>
</html>
