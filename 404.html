<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Demarest Nature Center</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        if (/^\/wp-content(\/|$)/i.test(path)) {
          window.location.replace('/');
        }
      } catch (e) {}
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/">
  </noscript>
</head>
<body>
  <header id="header">
    <div class="container">
      <div class="logo">
        <a href="/">
          <img src="/assets/images/logo.png" alt="Demarest Nature Center" id="site-logo">
          <span class="logo-text">Demarest Nature Center</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="content-section">
      <div class="container" style="text-align: center; padding: 4rem 1rem;">
        <h1>Page Not Found</h1>
        <p>Sorry, the page you were looking for doesn&rsquo;t exist on this site.</p>
        <p style="margin-top: 2rem;">
          <a href="/" class="btn btn-primary">Return to Home</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
