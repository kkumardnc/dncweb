name: Update carousel from calendar

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update carousel images from upcoming events
        run: node scripts/update-carousel-from-calendar.mjs

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update carousel images from upcoming calendar events
          branch: automation/update-carousel-from-calendar
          delete-branch: true
          title: Update carousel images from upcoming calendar events
          body: |
            Auto-generated update of homepage carousel slide images, sourced
            from the image URLs in upcoming Google Calendar event descriptions.

            Slides are ordered by event start time (soonest first). Re-run the
            "Update carousel from calendar" workflow to refresh.
