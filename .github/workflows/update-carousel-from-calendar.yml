name: Update carousel from calendar

on:
  workflow_dispatch:
  schedule:
    # 11:00 PM US Eastern -> 04:00 UTC (fixed; will run at 11pm EST / midnight EDT)
    - cron: '0 4 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update carousel images from upcoming events
        run: node scripts/update-carousel-from-calendar.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Next 6 calendar events are unchanged; skipping commit and push."
          else
            git commit -m "Update carousel slides from upcoming calendar events"
            git push
          fi
