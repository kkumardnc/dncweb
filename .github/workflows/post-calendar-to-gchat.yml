name: Post calendar events to Google Chat

on:
  workflow_dispatch:
  schedule:
    # 11:00 PM US Eastern -> 04:00 UTC (fixed; will run at 11pm EST / midnight EDT)
    - cron: '0 4 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Post upcoming events to Google Chat
        env:
          GCHAT_CALENDAR_URL: ${{ secrets.GCHAT_CALENDAR_URL }}
        run: node scripts/post-calendar-to-gchat.mjs
